name: Build Hermes Desktop Light (macOS + Windows)

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Official Hermes source branch, tag, or commit"
        required: true
        default: "main"
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS Light DMG
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.source_ref }}
          path: hermes-source
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: bash
        run: |
          sha="$(git -C hermes-source rev-parse HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Source commit: $sha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build official Hermes Desktop Light (macOS)
        working-directory: hermes-source
        shell: bash
        run: |
          # hdiutil create can fail intermittently with EBUSY on hosted macOS
          # runners while the filesystem is still flushing/indexing the app bundle.
          for attempt in 1 2 3; do
            log_file="$RUNNER_TEMP/hermes-desktop-build-$attempt.log"
            echo "Desktop build attempt $attempt/3"
            sync

            if python scripts/bundles/desktop.py \
              --commit=${{ steps.source.outputs.sha }} \
              --variant=light 2>&1 | tee "$log_file"; then
              exit 0
            else
              status=$?
            fi

            if ! grep -Fq "hdiutil: create failed - Resource busy" "$log_file"; then
              echo "Desktop build failed for a reason other than the retryable hdiutil EBUSY error." >&2
              exit "$status"
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Transient hdiutil Resource busy; syncing and retrying in 10 seconds..."
              sleep 10
            fi
          done

          echo "DMG creation continued to fail with hdiutil Resource busy after 3 attempts." >&2
          exit 1

      - name: Resolve prepared Python
        id: prepared
        working-directory: hermes-source
        run: |
          python_path="$(python -c "import json; print(json.load(open('.build/desktop-job/prepared.json', encoding='utf-8'))['python'])")"
          test -x "$python_path" || { echo "Prepared Python not found: $python_path" >&2; exit 1; }
          echo "python=$python_path" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Package macOS DMG (Light)
        working-directory: hermes-source/apps/desktop
        run: npm run dist:mac:dmg -- --publish never
        env:
          HERMES_PYTHON: ${{ steps.prepared.outputs.python }}
          HERMES_DESKTOP_VARIANT: light
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://npmmirror.com/mirrors/electron/

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: hermes-light-macos
          path: hermes-source/apps/desktop/release/*.dmg

  build-windows:
    name: Build Windows x64 Light ZIP
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Checkout official Hermes source
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: ${{ inputs.source_ref }}
          path: hermes-source
          fetch-depth: 0

      - name: Resolve source commit
        id: source
        shell: pwsh
        run: |
          $sha = git -C hermes-source rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          Write-Host "Source commit: $sha"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build official Hermes Desktop Light (Windows)
        working-directory: hermes-source
        run: |
          python scripts/bundles/desktop.py `
            --commit=${{ steps.source.outputs.sha }} `
            --variant=light

      - name: Package unpacked Windows application (Light)
        working-directory: hermes-source
        run: |
          npm run pack --workspace apps/desktop
        env:
          HERMES_DESKTOP_VARIANT: light

      - name: Locate and validate portable application
        id: app
        shell: pwsh
        run: |
          $releaseDir = Join-Path $env:GITHUB_WORKSPACE "hermes-source/apps/desktop/release"
          if (!(Test-Path $releaseDir)) { throw "Desktop release directory not found: $releaseDir" }

          $exe = Get-ChildItem -Path $releaseDir -Filter "Hermes Light.exe" -Recurse -File |
            Where-Object { $_.FullName -match "win-unpacked" } |
            Select-Object -First 1

          if (!$exe) { throw "Hermes Light.exe was not found in the unpacked Windows build." }

          $appDir = $exe.Directory.FullName
          $stageDir = Join-Path $env:GITHUB_WORKSPACE "portable-stage"
          New-Item -ItemType Directory -Force -Path $stageDir | Out-Null
          Copy-Item -Path (Join-Path $appDir "*") -Destination $stageDir -Recurse -Force

          $pythonFiles = Get-ChildItem $stageDir -Recurse -File | Where-Object {
              $_.Name -match '^(python|python3)(\.exe)?$' -or $_.FullName -match '\\(python|python3|site-packages)\\'
          }
          if ($pythonFiles) { throw "Possible Python runtime found in Light package." }

          $zip = Join-Path $env:GITHUB_WORKSPACE "Hermes-DesktopLight-Windows-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zip -CompressionLevel Optimal
          "zip=$zip" >> $env:GITHUB_OUTPUT
          Write-Host "Portable ZIP created: $zip"

      - name: Upload Windows Portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: hermes-light-windows-portable
          path: ${{ steps.app.outputs.zip }}
